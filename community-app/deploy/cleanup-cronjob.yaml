apiVersion: batch/v1
kind: CronJob
metadata:
  name: ernest-retention
  namespace: ernest-community
spec:
  schedule: '*/15 * * * *'
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: ernest-retention
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: cleanup
              # Verified application image: build ernest-test-17, commit 57cc9a6.
              image: image-registry.openshift-image-registry.svc:5000/ernest-community/ernest-test@sha256:dfccd1106522417699f598d8ab953184abaa807a85c2747e21a9a492ff44ebf3
              imagePullPolicy: IfNotPresent
              workingDir: /opt/app-root/src
              command: ['python', 'manage.py', 'cleanup_community']
              env:
                - name: MYSQL_HOST
                  value: dbod-ernest-community.cern.ch
                - name: MYSQL_PORT
                  value: '5557'
                - name: MYSQL_DATABASE
                  value: ernest_community
                - name: MYSQL_USER
                  value: ernest_app
              envFrom:
                - secretRef:
                    name: ernest-django
                - secretRef:
                    name: ernest-mysql
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ['ALL']
                runAsNonRoot: true
